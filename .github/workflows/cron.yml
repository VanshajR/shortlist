# Keeps the Space awake and kicks off a fetch every 3 hours.
name: cron

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: wake the space
        run: curl -fsS --retry 5 --retry-delay 20 --retry-all-errors "${{ secrets.SPACE_URL }}/health"
      - name: fetch jobs
        run: >
          curl -fsS -X POST "${{ secrets.SPACE_URL }}/fetch"
          -H "X-Fetch-Token: ${{ secrets.FETCH_TOKEN }}"
