# Every six hours: pull new jobs, refresh the profile, embed what's new, rank and judge.
# GitHub runs it, so nothing has to stay awake.
name: fetch

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # the first run embeds every candidate job; later runs take a minute or two
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - run: python -m shortlist.fetch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Telegram and HN posts are read by a model
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: python -m shortlist.profile && python -m shortlist.retrieve index
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: python -m shortlist.rank --judge 15
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
