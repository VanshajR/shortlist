# Send the digest by hand. The daily one comes from Vercel Cron (vercel.json): GitHub dropped
# this workflow's scheduled run on its first morning, and its schedules aren't guaranteed.
name: digest

on:
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - run: python -m shortlist.digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
