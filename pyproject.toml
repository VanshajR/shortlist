[project]
name = "shortlist"
version = "0.1.0"
description = "A job-hunt copilot that finds roles worth applying to and helps you apply well."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]

[project.optional-dependencies]
# Only for the private, local-only sources. Never installed in the public image.
private = ["python-jobspy>=1.1"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shortlist = ["migrations/*.sql"]
